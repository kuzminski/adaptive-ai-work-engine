name: AAW portable build

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "AAW.py"
      - "product_*.py"
      - "autonomy_*.py"
      - "PRODUCT_UI/**"
      - "packaging/**"
      - "MODEL_RECOMMENDATIONS.json"
      - ".github/workflows/aaw-portable.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller==6.22.3
      - name: Engine safe-stop + product checks that need no provider run
        run: |
          python -m pip install pytest
          python -m pytest -q -p no:cacheprovider test_autonomy_safe_stop.py test_product_mvp.py -k "catalog_recommended_equals or unavailable_recommended or login_parsers or update_newer or no_cli or server_requires"
      - name: Full product suite on Windows (informational; fake CLIs via .cmd wrappers)
        continue-on-error: true
        run: python -m pytest -q -p no:cacheprovider test_product_mvp.py
      - name: Build portable app
        run: python packaging/build_portable.py
      - name: Launch smoke test (server answers on loopback)
        shell: pwsh
        run: |
          $env:AAW_PRODUCT_HOME = "$PWD\build\smoke_home"
          $p = Start-Process -FilePath "dist\AAW\AAW.exe" -ArgumentList "--no-browser","--port","8799" -PassThru
          Start-Sleep -Seconds 8
          $page = Invoke-WebRequest -Uri "http://127.0.0.1:8799/" -UseBasicParsing
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch "aaw-token") { throw "UI did not load" }
          $det = & dist\AAW\AAW.exe --detect | Out-String
          Write-Output $det
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AAW-Windows-x64
          path: dist/AAW-Windows-x64.zip
          if-no-files-found: error
