name: AAW portable build

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "AAW.py"
      - "product_*.py"
      - "autonomy_*.py"
      - "run_cancellation.py"
      - "test_product_mvp.py"
      - "test_autonomy_safe_stop.py"
      - "PRODUCT_UI/**"
      - "packaging/**"
      - "MODEL_RECOMMENDATIONS.json"
      - ".github/workflows/aaw-portable.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller==6.22.3
      - name: Engine safe-stop + product checks that need no provider run
        run: |
          python -m pip install pytest
          python -m pytest -q -p no:cacheprovider test_autonomy_safe_stop.py test_product_mvp.py -k "catalog_recommended_equals or unavailable_recommended or login_parsers or update_newer or no_cli or server_requires"
      - name: Full product suite on Windows (real worker processes, fake CLIs via .cmd wrappers)
        timeout-minutes: 10
        run: python -m pytest -q -p no:cacheprovider -rf test_product_mvp.py
      - name: Build portable app
        timeout-minutes: 10
        run: python packaging/build_portable.py
      - name: Launch smoke test (frozen exe detects providers and serves the UI on loopback)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:AAW_PRODUCT_HOME = "$PWD\build\smoke_home"
          $d = Start-Process -FilePath "dist\AAW\AAW.exe" -ArgumentList "--detect","--report-file","$PWD\build\detect.json" -PassThru -Wait
          Get-Content "$PWD\build\detect.json"
          if ($d.ExitCode -ne 0) { throw "--detect failed" }
          $p = Start-Process -FilePath "dist\AAW\AAW.exe" -ArgumentList "--no-browser","--port","8799" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $page = Invoke-WebRequest -Uri "http://127.0.0.1:8799/" -UseBasicParsing -TimeoutSec 3
              if ($page.StatusCode -eq 200 -and $page.Content -match "aaw-token") { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "UI did not load" }
          Write-Output "UI served by the frozen AAW.exe"
      - name: AAW logs
        if: always()
        shell: pwsh
        run: Get-ChildItem -Recurse build -Filter aaw.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "== $_"; Get-Content $_ -Tail 80 }
      - uses: actions/upload-artifact@v4
        with:
          name: AAW-Windows-x64
          path: dist/AAW-Windows-x64.zip
          if-no-files-found: error
