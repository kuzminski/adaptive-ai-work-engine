function wireNodeEditor(nodeId) {
  const type = $("#edType");
  if (!type) return;
  const node = draftNode(nodeId);
  const set = (fn, label) => { fn(draftNode(nodeId)); touch(label || "edit node property"); };

  type.addEventListener("change", () => {
    set((n) => {
      const next = type.value;
      const defaults = clone(DEFAULTS[next] || {});
      // Only fields the *new* type needs are replaced; the brief and the
      // acceptance criteria are the user's work and survive a type change.
      n.type = next;
      ["role", "model", "effort", "capability", "command", "timeout_seconds"].forEach((k) => delete n[k]);
      Object.keys(defaults).forEach((k) => {
        if (k !== "instructions" && k !== "acceptance") n[k] = defaults[k];
      });
      if (next === "HUMAN_GATE") { delete n.routing; delete n.edges; }
      else n.routing = n.routing || "FIRST_MATCH";
    }, "edit node type");
    openInspector(nodeId);
  });
  $("#edRunIf").addEventListener("change", () => set((n) => { n.run_if = $("#edRunIf").value; }));
  $("#edRole").addEventListener("input", () => set((n) => { n.role = $("#edRole").value || null; }));
  const model = $("#edModel"); if (model) model.addEventListener("input", () => set((n) => { n.model = model.value || null; }));
  const effort = $("#edEffort"); if (effort) effort.addEventListener("input", () => set((n) => { n.effort = effort.value || null; }));
  const command = $("#edCommand");
  if (command) command.addEventListener("input", () => set((n) => {
    n.command = command.value.split(/\s+/).filter(Boolean); }));
  const timeout = $("#edTimeout");
  if (timeout) timeout.addEventListener("input", () => set((n) => {
    const v = parseInt(timeout.value, 10); n.timeout_seconds = Number.isFinite(v) ? v : timeout.value; }));
  $("#edInstr").addEventListener("input", () => set((n) => { n.instructions = $("#edInstr").value; }));
  $("#edAccept").addEventListener("input", () => set((n) => {
    n.acceptance = $("#edAccept").value.split("\n").map((s) => s.trim()).filter(Boolean); }));
  $("#edDepends").addEventListener("change", () => set((n) => {
    n.depends_on = Array.from($("#edDepends").selectedOptions).map((o) => o.value); }));
  $("#edStart").addEventListener("click", () => { set((n) => { S.draft.start_node = n.id; }, "change start node"); openInspector(nodeId); });
  $("#edDelete").addEventListener("click", () => { deleteNode(nodeId); });
  Array.from($("#iBody").querySelectorAll("[data-open-edge]")).forEach((button) => {
    button.addEventListener("click", () => openEdgeInspector(button.dataset.openEdge));
  });
  if (node && node.type === "HUMAN_GATE") { /* terminal by construction */ }
}

/* ─────────────────────────── BUILD: edge inspector ─────────────────────────── */
function openEdgeInspector(edgeId, options) {
  const found = findEdge(edgeId);
  if (!found) { closeInspector(); render(); return; }
  inspectorToken += 1;                       // an in-flight node render must not win
  const keep = options && options.keep;
  const scroll = keep ? $("#iBody").scrollTop : 0;
  S.selectedEdge = edgeId; S.selected = null;
  const { node, edge } = found;
  const when = edge.when || {};
  const predicate = Object.keys(when)[0] || "";
  const targets = draftNodes().map((n) => n.id).concat(["STOP", "HUMAN_REQUIRED"]);
  const diag = diagnosticForEdge(edgeId);
  const runtime = S.edgeState[edgeId];
  $("#iId").textContent = edgeId;
  $("#iType").textContent = `EDGE · ${node.id} → ${edge.to}`;

  const parts = [];
  if (diag) parts.push(section("Validation", `<p style="color:#f0c4be">${esc(diag.message)}</p>` +
    (diag.repair === "KEEP_ONLY_THIS_UNCONDITIONAL" && S.mode === "build"
      ? `<div class="row"><button class="btn sm" id="egRepairUnconditional">Keep ${esc(edgeId)} unconditional; delete the conflicting fallback(s)</button></div>`
      : "")));
  if (runtime) parts.push(section("Runtime", `<div class="edgerow">` +
    `<span class="pill" data-k="${runtime.state === "selected" ? "SELECTED" : "HELD"}">${esc(runtime.state.toUpperCase())}</span>` +
    (runtime.hold_reason ? `<span>${esc(runtime.hold_reason)}</span>` : "") + `</div>`));

  parts.push(section("Edge (BUILD)", `
    <div class="two">
      <div class="fld"><label>kind</label>
        <select id="egKind">${["CONTINUE", "REPAIR", "FALLBACK"].map((k) =>
          `<option value="${k}"${k === (edge.kind || "CONTINUE") ? " selected" : ""}>${k}</option>`).join("")}</select></div>
      <div class="fld"><label>target</label>
        <select id="egTo">${targets.map((t) =>
          `<option value="${t}"${t === edge.to ? " selected" : ""}>${t}</option>`).join("")}</select></div>
    </div>
    <div class="two">
      <div class="fld"><label>predicate</label>
        <select id="egPred">
          <option value=""${predicate ? "" : " selected"}>unconditional</option>
          ${["verdict", "outcome", "has_findings", "min_severity"].map((k) =>
            `<option value="${k}"${k === predicate ? " selected" : ""}>${k}</option>`).join("")}
        </select></div>
      <div class="fld"><label>value</label>
        <select id="egValue"${predicate ? "" : " disabled"}>${predicateValues(predicate, when[predicate])}</select></div>
    </div>
    <div class="fld"><label>label (visual only)</label>
      <input type="text" id="egLabel" value="${esc(edge.label || "")}"></div>
    <div class="fld"><label>routing mode of ${esc(node.id)}</label>
      <select id="egRouting">${["FIRST_MATCH", "ALL_MATCHES"].map((m) =>
        `<option value="${m}"${m === (node.routing || "FIRST_MATCH") ? " selected" : ""}>${m}</option>`).join("")}</select></div>
    <div class="row">
      <button class="btn sm" id="egInsert">Insert node into this edge</button>
      <button class="btn sm danger" id="egDelete">Delete edge</button>
    </div>
    <div class="note" id="egNote"></div>`));

  $("#iBody").innerHTML = parts.join("");
  wireEdgeInspector(edgeId);
  insp.dataset.open = "true";
  $("#iBody").scrollTop = scroll;
  if (!keep) render();
}

function predicateValues(key, current) {
  const options = {
    verdict: (S.contract && S.contract.verdicts) || ["PASS", "REPAIR", "BLOCKED"],
    outcome: (S.contract && S.contract.outcomes) || ["PASS", "FAIL", "BLOCKED", "INVALID"],
    has_findings: ["true", "false"],
    min_severity: (S.contract && S.contract.severity_ladder) || ["LOW", "MEDIUM", "HIGH", "CRITICAL"],
  }[key] || [];
  return options.map((v) => `<option value="${esc(v)}"${String(current) === String(v) ? " selected" : ""}>${esc(v)}</option>`).join("");
}

function wireEdgeInspector(edgeId) {
  const found = findEdge(edgeId);
  if (!found) return;
  const apply = (fn) => {
    const target = findEdge(edgeId);
    if (!target) return;
    fn(target.edge, target.node);
    normalizeEdgeOrder(target.node);
    touch("edit edge property");
    openEdgeInspector(edgeId, { keep: true });
  };
  $("#egKind").addEventListener("change", () => apply((e) => { e.kind = $("#egKind").value; }));
  $("#egTo").addEventListener("change", () => apply((e) => { e.to = $("#egTo").value; }));
  $("#egLabel").addEventListener("input", () => apply((e) => { e.label = $("#egLabel").value || null; }));
  $("#egRouting").addEventListener("change", () => apply((_e, n) => { n.routing = $("#egRouting").value; }));
  $("#egPred").addEventListener("change", () => apply((e) => {
    const key = $("#egPred").value;
    if (!key) { e.when = null; return; }
    const first = predicateValues(key, null).match(/value="([^"]*)"/);
    let value = first ? first[1] : null;
    if (key === "has_findings") value = value === "true";
    e.when = { [key]: value };
  }));
  $("#egValue").addEventListener("change", () => apply((e) => {
    const key = $("#egPred").value;
    if (!key) return;
    let value = $("#egValue").value;
    if (key === "has_findings") value = value === "true";
    e.when = { [key]: value };
  }));
  $("#egDelete").addEventListener("click", () => { deleteEdge(edgeId); closeInspector(); render(); });
  const repair = $("#egRepairUnconditional");
  if (repair) repair.addEventListener("click", () => {
    const target = findEdge(edgeId);
    if (!target) return;
    target.node.edges = (target.node.edges || []).filter((e) =>
      e.edge_id === edgeId || (e.when && Object.keys(e.when).length));
    normalizeEdgeOrder(target.node);
    touch("repair conflicting unconditional FIRST_MATCH edges");
    openEdgeInspector(edgeId, { keep: true });
  });
  $("#egInsert").addEventListener("click", (ev) => {
    openMenu(ev.clientX, ev.clientY, (type) => {
      const id = insertIntoEdge(edgeId, type);
      if (id) openInspector(id);
    });
  });
}

/* ─────────────────────────── node type menu ─────────────────────────── */
function openMenu(clientX, clientY, choose) {
  menu.innerHTML = NODE_TYPES.map((t) =>
    `<button data-t="${t}"><i></i>${t}</button>`).join("") +
    `<button data-t=""><i style="background:transparent"></i>cancel</button>`;
  // The menu is a child of #stage, so it is positioned in stage coordinates.
  // Using client coordinates would offset it by the instrument bar's height.
  const rect = stage.getBoundingClientRect();
  menu.style.left = clamp(clientX - rect.left, 4, rect.width - 160) + "px";
  menu.style.top = clamp(clientY - rect.top, 4, rect.height - 190) + "px";
  menu.dataset.open = "true";
  const onClick = (ev) => {
    const button = ev.target.closest("button");
    if (!button) return;
    menu.dataset.open = "false";
    menu.removeEventListener("click", onClick);
    if (button.dataset.t) choose(button.dataset.t);
  };
  menu.addEventListener("click", onClick);
}

$("#warnClose").addEventListener("click", closeWarn);
function renderWorktreeInspector(worktree) {
  const modified = worktree.modified_files || [];
  const untracked = worktree.untracked_files || [];
  const changes = worktree.changes || [];
  $("#iId").textContent = "WORKTREE";
  $("#iType").textContent = worktree.work_state || "";
  $("#iBody").innerHTML =
    section("Run ownership", `<dl><dt>originating run</dt><dd><code>${esc(worktree.originating_run_id || "?")}</code></dd>
      <dt>worktree</dt><dd><code>${esc(worktree.worktree || "")}</code></dd>
      <dt>ownership</dt><dd>${esc(worktree.ownership || "UNKNOWN")}</dd>
      <dt>mixed run/user change possible</dt><dd>${worktree.mixed_change_possible ? "YES — destructive cleanup refused" : "NO — frozen snapshot still matches"}</dd>
      <dt>resolution</dt><dd>${esc(worktree.resolution || "UNRESOLVED")}</dd></dl>` +
      ((worktree.baseline_state || worktree.baseline_id) ?
        `<h4>${esc(worktree.baseline_state || "AUTHORIZED WORKSPACE BASELINE")}</h4><dl>` +
        `<dt>identity</dt><dd><code>${esc(worktree.baseline_id || "")}</code></dd>` +
        `<dt>fingerprint</dt><dd><code>${esc(worktree.baseline_fingerprint || worktree.baseline_workspace_tree || "")}</code></dd>` +
        `<dt>provenance</dt><dd><code>${esc((worktree.baseline_provenance || {}).originating_run_id || worktree.originating_run_id || "")}</code></dd></dl>` : "") +
      ((worktree.proof_reasons || []).length ? `<ul>${worktree.proof_reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : "")) +
    section(`Modified files (${modified.length})`, modified.length
      ? "<ul>" + modified.map((f) => `<li><code>${esc(f)}</code></li>`).join("") + "</ul>" : "<p>none</p>") +
    section(`Untracked files (${untracked.length})`, untracked.length
      ? "<ul>" + untracked.map((f) => `<li><code>${esc(f)}</code></li>`).join("") + "</ul>" : "<p>none</p>") +
    section("Changes", changes.length ? changes.map((row) =>
      `<details><summary><code>${esc(row.path)}</code> · ${esc(row.status)}</summary>` +
      `<pre style="white-space:pre-wrap;font-size:10px;overflow:auto">${esc(row.diff || "no textual preview")}</pre>` +
      (row.preview_truncated ? `<p>preview truncated</p>` : "") + `</details>`).join("") : "<p>none</p>") +
    section("Resolve", `<div class="row">
      <button class="btn sm" id="workKeep"${worktree.resolution !== "UNRESOLVED" ? " disabled" : ""}>Keep changes</button>
      <button class="btn sm" id="workAdopt"${worktree.cleanup_available ? "" : " disabled"}>Adopt as baseline</button>
      <button class="btn sm danger" id="workDiscard"${worktree.cleanup_available ? "" : " disabled"}>Discard changes produced by this run</button>
      </div><p id="workNote" class="note">Adoption records an authorized content-addressed Git tree without a commit. Discard restores only proven run changes to the exact pre-run baseline. No hard reset, merge, branch move, commit, or runtime-history edit.</p>`);
  insp.dataset.open = "true";
  const keep = $("#workKeep"); if (keep) keep.addEventListener("click", async () => {
    try {
      const report = await api("/api/run/worktree/keep", { method: "POST",
        body: JSON.stringify({ run_id: S.run.run_id }) });
      $("#warn").__worktree = report; renderWorktreeInspector(report);
      setStatus(null, "<b>changes kept</b> · worktree contents were not modified");
    } catch (error) { $("#workNote").textContent = error.message; }
  });
  const adopt = $("#workAdopt"); if (adopt) adopt.addEventListener("click", async () => {
    if (!window.confirm("Authorize these exact workspace contents as the baseline for subsequent AAW runs?")) return;
    try {
      const report = await api("/api/run/worktree/adopt", { method: "POST",
        body: JSON.stringify({ run_id: S.run.run_id }) });
      $("#warn").__worktree = report; renderWorktreeInspector(report); closeWarn();
      setStatus("pass", `<b>AUTHORIZED WORKSPACE BASELINE</b> · ${esc(report.baseline_id || "")} · subsequent runs may start while this proof matches`);
    } catch (error) { $("#workNote").textContent = `adoption refused — ${error.message}`; }
  });
  const discard = $("#workDiscard"); if (discard) discard.addEventListener("click", async () => {
    if (!window.confirm("Discard only the exact modified and untracked files proven to belong to this run?")) return;
    try {
      const report = await api("/api/run/worktree/discard", { method: "POST",
        body: JSON.stringify({ run_id: S.run.run_id }) });
      $("#warn").__worktree = report; renderWorktreeInspector(report); closeWarn();
      setStatus("pass", "<b>run-owned changes discarded</b> · worktree is back at the proven clean baseline · ready to rerun");
    } catch (error) { $("#workNote").textContent = `cleanup refused — ${error.message}`; }
  });
}
$("#warnInspect").addEventListener("click", async () => {
  try {
    const report = await api("/api/run/worktree?run_id=" + encodeURIComponent(S.run.run_id));
    $("#warn").__worktree = report; renderWorktreeInspector(report);
  } catch (error) { setStatus("halt", `inspection failed — ${esc(error.message)}`); }
});
$("#btnReconnect").addEventListener("click", () => {
  // Deliberately keeps the rendered state and resumes from the last sequence
  // it drew, so the UI never replays a run it has already shown.
  closeStream();
  setStatus("live", `reconnecting from sequence ${S.lastSequence}…`);
  openStream(S.lastSequence);
  syncRunButton();
});
Array.from(document.querySelectorAll("#palette button")).forEach((button) => {
  button.addEventListener("click", () => {
    const center = centerOfView();
    const spot = freeSpot(center.x, center.y);
    openInspector(addNode(button.dataset.t, spot.x, spot.y));
  });
});

let drag = null, pan = null, wiring = null;

stage.addEventListener("pointerdown", (ev) => {
  if (menu.dataset.open === "true" && !ev.target.closest("#menu")) menu.dataset.open = "false";
  if (ev.target.closest("#insp") || ev.target.closest("#palette") ||
      ev.target.closest("#warn") || ev.target.closest("#menu")) return;

  const port = ev.target.closest(".port.out");
  if (port && S.mode === "build") {
    wiring = { from: port.dataset.port, x: ev.clientX, y: ev.clientY, over: null, ghost: null };
    stage.classList.add("wiring");
    stage.setPointerCapture(ev.pointerId);
    ev.preventDefault();
    return;
  }
  const wire = ev.target.closest(".whit");
  if (wire && S.mode === "build") { openEdgeInspector(wire.dataset.edge); return; }

  const nodeEl = ev.target.closest(".node");
  if (nodeEl && S.mode === "build") {
    const id = nodeEl.dataset.id;
    const pos = positionOf(id);
    drag = { id, ox: ev.clientX, oy: ev.clientY, x: pos.x, y: pos.y, moved: false,
             minted: Boolean(S.minted[id]) };
    stage.setPointerCapture(ev.pointerId);
    return;
  }
  if (nodeEl) { openInspector(nodeEl.dataset.id); return; }
  pan = { x: ev.clientX, y: ev.clientY, vx: S.view.x, vy: S.view.y };
  stage.classList.add("panning");
  stage.setPointerCapture(ev.pointerId);
});

stage.addEventListener("pointermove", (ev) => {
  if (wiring) {
    const from = positionOf(wiring.from);
    const a = { x: from.x + NW, y: from.y + NH / 2 };
    const b = toWorld(ev.clientX, ev.clientY);
    const mid = Math.max(28, Math.abs(b.x - a.x) * 0.45);
    wiring.ghost = `M${a.x},${a.y} C${a.x + mid},${a.y} ${b.x - mid},${b.y} ${b.x},${b.y}`;
    const overEl = document.elementFromPoint(ev.clientX, ev.clientY);
    const overNode = overEl && overEl.closest(".node");
    wiring.over = overNode && overNode.dataset.id !== wiring.from ? overNode.dataset.id : null;
    render();
    return;
  }
  if (drag) {
    const dx = (ev.clientX - drag.ox) / S.view.k, dy = (ev.clientY - drag.oy) / S.view.k;
    if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
    const next = { x: drag.x + dx, y: drag.y + dy };
    if (drag.minted) S.minted[drag.id].__pos = next; else S.layout.nodes[drag.id] = next;
    render();
    return;
  }
  if (pan) {
    S.view.x = pan.vx + (ev.clientX - pan.x);
    S.view.y = pan.vy + (ev.clientY - pan.y);
    render();
  }
});

stage.addEventListener("pointerup", async (ev) => {
  if (wiring) {
    const { from, over } = wiring;
    wiring = null;
    stage.classList.remove("wiring");
    if (over) {
      const edgeId = addEdge(from, over);
      render();
      if (edgeId) openEdgeInspector(edgeId);
      return;
    }
    // Released in empty space: create the next node there and wire to it.
    // This is the interaction that makes a four-node graph fast.
    const spot = toWorld(ev.clientX, ev.clientY);
    openMenu(ev.clientX, ev.clientY, (type) => {
      const id = addNode(type, spot.x - NW / 2, spot.y - NH / 2, true);
      addEdge(from, id);
      render();
      openInspector(id);
    });
    render();
    return;
  }
  if (drag) {
    const { id, moved, minted } = drag; drag = null;
    if (!moved) { openInspector(id); return; }
    // A minted node's position is a runtime rendering decision and is never
    // persisted: a run must not write into a BUILD artifact.
    if (!minted) touch("move node");
    return;
  }
  if (pan) { pan = null; stage.classList.remove("panning"); await persistLayout(); }
});

stage.addEventListener("dblclick", (ev) => {
  if (S.mode !== "build") return;
  if (ev.target.closest(".node") || ev.target.closest("#insp") ||
      ev.target.closest("#palette") || ev.target.closest("#warn")) return;
  const spot = toWorld(ev.clientX, ev.clientY);
  openMenu(ev.clientX, ev.clientY, (type) => openInspector(addNode(type, spot.x - NW / 2, spot.y - NH / 2)));
});

stage.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const before = S.view.k;
  S.view.k = clamp(before * (ev.deltaY < 0 ? 1.1 : 1 / 1.1), 0.3, 2.2);
  const rect = stage.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  S.view.x = mx - (mx - S.view.x) * (S.view.k / before);
  S.view.y = my - (my - S.view.y) * (S.view.k / before);
  render();
}, { passive: false });

let layoutTimer = null;
async function persistLayout(immediate) {
  if (!S.workflowId) return;
  clearTimeout(layoutTimer);
  const write = async () => {
    const nodes = {};
    Object.keys(S.layout.nodes).forEach((id) => {
      nodes[id] = { x: S.layout.nodes[id].x, y: S.layout.nodes[id].y };
    });
    try {
      const saved = await api("/api/layout/save", { method: "POST",
        body: JSON.stringify({ workflow_id: S.workflowId, layout: { nodes, viewport: S.view } }) });
      // Layout is stored apart from the workflow: the semantic hash it records
      // is provenance, and the graph on screen is unchanged by the save.
      const same = S.graph && saved.workflow_semantic_hash === S.graph.semantic_hash;
      $("#tapeMeta").textContent = `layout saved · workflow semantics ${same ? "unchanged" : "MOVED"}`;
    } catch (_) { /* a failed layout save must never break the canvas */ }
  };
  if (immediate) return write();
  layoutTimer = setTimeout(write, 260);
}

window.addEventListener("keydown", (ev) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || "").toUpperCase());
  if (ev.key === "Escape") {
    menu.dataset.open = "false"; closeInspector(); closeWarn(); render(); return;
  }
  const command = ev.metaKey || ev.ctrlKey;
  if (command && S.mode === "build" && ev.key.toLowerCase() === "z") {
    ev.preventDefault(); ev.shiftKey ? redoDraft() : undoDraft(); return;
  }
  if (command && S.mode === "build" && ev.key.toLowerCase() === "y") {
    ev.preventDefault(); redoDraft(); return;
  }
  if (typing) return;
  if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); startRun(null); return; }
  if (ev.key === "s" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); saveWorkflow(); return; }
  if ((ev.key === "Delete" || ev.key === "Backspace") && S.mode === "build") {
    if (S.selectedEdge) { ev.preventDefault(); deleteEdge(S.selectedEdge); closeInspector(); render(); }
    else if (S.selected && !S.minted[S.selected]) { ev.preventDefault(); deleteNode(S.selected); render(); }
  }
});

boot();
})();
</script>
</body>
</html>
